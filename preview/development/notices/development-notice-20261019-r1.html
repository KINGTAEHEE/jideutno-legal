<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>개발용 안내 확인</title><style>:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:24px;line-height:1.8}</style></head><body><h1>개발용 안내 확인</h1><p>원격 공지 목록·홈 배너·팝업 동작을 확인하는 개발용 안내예요.</p><p>실제 이용약관 개정 예고가 아니며 현행 약관의 내용과 동의 버전은 바뀌지 않아요.</p><p>공지 내용을 확인하고 닫은 뒤 앱을 다시 열어 중복 노출 여부를 확인해주세요.</p></body></html>
