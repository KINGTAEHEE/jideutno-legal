name: Development legal catalog
on:
  push:
    branches: [agent/remote-legal-development]
  pull_request:
    paths:
      [
        "preview/development/**",
        "tools/**",
        ".github/workflows/development-legal.yml",
        "README-notices.md",
      ]
permissions:
  contents: read
concurrency:
  group: development-legal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generation and publication safeguards
        run: node --test tools/tests/development-legal.test.mjs
      - name: Generate and validate immutable publication
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != '0000000000000000000000000000000000000000' ]; then
            node tools/build-development.mjs --base "$BASE"
            node tools/build-development.mjs --check --base "$BASE"
          else
            node tools/build-development.mjs
            node tools/build-development.mjs --check
          fi
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/remote-legal-development'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the checked development catalog
        run: node tools/build-development.mjs
      - name: Publish only the generated development catalog
        run: node tools/publish-development.mjs
